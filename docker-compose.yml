version: '3.8'

services:
  lakehouse-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-lakehouse-engine
    volumes:
      - ./data:/workspace/data
      - ./configs:/workspace/configs
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
    command: ["python", "run_pipeline.py"]

  lakehouse-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-lakehouse-tests
    volumes:
      - ./tests:/workspace/tests
      - ./src:/workspace/src
    command: ["pytest", "tests/"]
